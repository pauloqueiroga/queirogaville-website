<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Kitty">
<title>My Kitty</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    font-family: -apple-system, 'Helvetica Neue', sans-serif;
    touch-action: none;
    user-select: none;
  }

  /* ===== PHONE WALLPAPER ===== */
  #wallpaper {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, #1a1a2e 0%, #16213e 40%, #0f3460 75%, #533483 100%);
    overflow: hidden;
  }

  .bokeh {
    position: absolute;
    border-radius: 50%;
    filter: blur(40px);
    opacity: 0.18;
    animation: bokehFloat 12s ease-in-out infinite;
  }
  .b1 { width: 200px; height: 200px; background: #a78bfa; top: 10%; left: 20%; animation-delay: 0s; }
  .b2 { width: 160px; height: 160px; background: #60a5fa; top: 50%; left: 65%; animation-delay: 3s; }
  .b3 { width: 120px; height: 120px; background: #f472b6; top: 70%; left: 10%; animation-delay: 6s; }
  .b4 { width: 100px; height: 100px; background: #34d399; top: 20%; left: 75%; animation-delay: 9s; }

  @keyframes bokehFloat {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(15px, -20px); }
    66% { transform: translate(-10px, 10px); }
  }

  /* ===== STATUS BAR ===== */
  #status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    z-index: 80;
    pointer-events: none;
  }

  #status-time {
    font-size: 15px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -0.3px;
  }

  #status-right {
    display: flex;
    align-items: center;
    gap: 5px;
    color: #fff;
  }

  .signal-dots { display: flex; gap: 2px; align-items: flex-end; }
  .signal-dots span {
    display: block;
    width: 3px;
    background: #fff;
    border-radius: 1px;
  }
  .signal-dots span:nth-child(1) { height: 5px; }
  .signal-dots span:nth-child(2) { height: 8px; }
  .signal-dots span:nth-child(3) { height: 11px; }
  .signal-dots span:nth-child(4) { height: 14px; }

  .wifi-icon { font-size: 13px; }

  .battery {
    display: flex; align-items: center; gap: 1px;
    border: 1.5px solid rgba(255,255,255,0.8);
    border-radius: 3px;
    padding: 1.5px 2px;
    position: relative;
    width: 22px; height: 12px;
  }
  .battery-fill {
    background: #fff;
    border-radius: 1px;
    height: 100%;
    width: 75%;
  }
  .battery-tip {
    position: absolute;
    right: -4px;
    top: 50%;
    transform: translateY(-50%);
    width: 2px; height: 5px;
    background: rgba(255,255,255,0.6);
    border-radius: 0 1px 1px 0;
  }

  /* ===== HOME SCREEN ===== */
  #home-screen {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 52px 0 8px;
    pointer-events: none;
    z-index: 5;
  }

  #icon-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 8px;
    padding: 8px 16px;
  }

  .app-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .app-icon-img {
    width: 56px; height: 56px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.4);
    position: relative;
    overflow: hidden;
  }
  /* iOS-style gloss */
  .app-icon-img::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%);
    border-radius: 13px 13px 0 0;
  }

  .app-icon-label {
    font-size: 10px;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    text-align: center;
    letter-spacing: 0.1px;
  }

  .ic-photos   { background: linear-gradient(135deg, #f9a8d4, #fb923c); }
  .ic-camera   { background: linear-gradient(135deg, #94a3b8, #475569); }
  .ic-music    { background: linear-gradient(135deg, #f43f5e, #e11d48); }
  .ic-maps     { background: linear-gradient(135deg, #4ade80, #16a34a); }
  .ic-messages { background: linear-gradient(135deg, #4ade80, #22c55e); }
  .ic-notes    { background: linear-gradient(135deg, #fde047, #f59e0b); }
  .ic-safari   { background: linear-gradient(135deg, #38bdf8, #0284c7); }
  .ic-books    { background: linear-gradient(135deg, #fb923c, #ea580c); }
  .ic-clock    { background: linear-gradient(135deg, #1e293b, #334155); }
  .ic-weather  { background: linear-gradient(135deg, #38bdf8, #7c3aed); }
  .ic-face     { background: linear-gradient(135deg, #4ade80, #059669); }
  .ic-settings { background: linear-gradient(135deg, #94a3b8, #64748b); }

  /* ===== DOCK ===== */
  #dock-container {
    margin: 0 14px 16px;
  }

  #page-dots {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-bottom: 8px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.4);
  }
  .dot.active { background: #fff; }

  #dock {
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(22px);
    -webkit-backdrop-filter: blur(22px);
    border-radius: 24px;
    padding: 11px 14px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    box-shadow: 0 2px 24px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .dock-icon {
    width: 56px; height: 56px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: 0 3px 14px rgba(0,0,0,0.4);
    position: relative; overflow: hidden;
  }
  .dock-icon::after {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 50%;
    background: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 100%);
    border-radius: 13px 13px 0 0;
  }

  /* ===== MOCHI ===== */
  #mochi-wrap {
    position: fixed;
    z-index: 50;
    pointer-events: none;
  }
  #mochi-canvas {
    pointer-events: all;
    cursor: pointer;
    display: block;
  }

  /* ===== YARN ===== */
  #yarn-wrap {
    position: fixed;
    z-index: 49;
    cursor: grab;
  }
  #yarn-wrap:active { cursor: grabbing; }
  #yarn-canvas { display: block; }

  /* ===== PARTICLES ===== */
  .float-particle {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 18px;
    animation: particleFloat 1.5s ease-out forwards;
  }
  @keyframes particleFloat {
    0%   { opacity: 1; transform: translate(0, 0) scale(0.5); }
    40%  { opacity: 1; transform: translate(var(--fx), -40px) scale(1.2); }
    100% { opacity: 0; transform: translate(var(--fx), -85px) scale(0.7); }
  }

  .zzz-float {
    position: fixed;
    pointer-events: none;
    z-index: 100;
    font-size: 14px;
    font-weight: 700;
    color: #c4b5fd;
    animation: zzzUp 2.2s ease-out forwards;
  }
  @keyframes zzzUp {
    0%   { opacity: 0.9; transform: translate(0,0) scale(0.7); }
    100% { opacity: 0; transform: translate(10px, -60px) scale(1); }
  }

  /* ===== MOOD CHIP ===== */
  #mood-chip {
    position: fixed;
    bottom: 142px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 20px;
    padding: 6px 18px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    z-index: 60;
    pointer-events: none;
    white-space: nowrap;
    letter-spacing: 0.2px;
  }

  /* ===== HINT ===== */
  #hint-toast {
    position: fixed;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 7px 18px;
    font-size: 12px;
    color: rgba(255,255,255,0.88);
    z-index: 90;
    pointer-events: none;
    transition: opacity 1.5s;
    white-space: nowrap;
  }
</style>
</head>
<body>

<div id="wallpaper">
  <div class="bokeh b1"></div>
  <div class="bokeh b2"></div>
  <div class="bokeh b3"></div>
  <div class="bokeh b4"></div>
</div>

<div id="status-bar">
  <div id="status-time">9:41</div>
  <div id="status-right">
    <div class="signal-dots"><span></span><span></span><span></span><span></span></div>
    <span class="wifi-icon">WiFi</span>
    <div class="battery"><div class="battery-fill"></div><div class="battery-tip"></div></div>
  </div>
</div>

<div id="home-screen">
  <div id="icon-grid">
    <div class="app-icon"><div class="app-icon-img ic-photos">🏞️</div><div class="app-icon-label">Photos</div></div>
    <div class="app-icon"><div class="app-icon-img ic-camera">📷</div><div class="app-icon-label">Camera</div></div>
    <div class="app-icon"><div class="app-icon-img ic-music">🎵</div><div class="app-icon-label">Music</div></div>
    <div class="app-icon"><div class="app-icon-img ic-maps">🗺️</div><div class="app-icon-label">Maps</div></div>
    <div class="app-icon"><div class="app-icon-img ic-messages">💬</div><div class="app-icon-label">Messages</div></div>
    <div class="app-icon"><div class="app-icon-img ic-notes">📝</div><div class="app-icon-label">Notes</div></div>
    <div class="app-icon"><div class="app-icon-img ic-safari">🧭</div><div class="app-icon-label">Safari</div></div>
    <div class="app-icon"><div class="app-icon-img ic-books">📚</div><div class="app-icon-label">Books</div></div>
    <div class="app-icon"><div class="app-icon-img ic-clock">🕐</div><div class="app-icon-label">Clock</div></div>
    <div class="app-icon"><div class="app-icon-img ic-weather">🌤️</div><div class="app-icon-label">Weather</div></div>
    <div class="app-icon"><div class="app-icon-img ic-face">📹</div><div class="app-icon-label">FaceTime</div></div>
    <div class="app-icon"><div class="app-icon-img ic-settings">⚙️</div><div class="app-icon-label">Settings</div></div>
  </div>

  <div id="dock-container">
    <div id="page-dots">
      <div class="dot active"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <div id="dock">
      <div class="dock-icon ic-messages">💬</div>
      <div class="dock-icon" style="background:linear-gradient(135deg,#4ade80,#16a34a)">📞</div>
      <div class="dock-icon ic-safari">🧭</div>
      <div class="dock-icon" style="background:linear-gradient(135deg,#818cf8,#6366f1)">🎵</div>
    </div>
  </div>
</div>

<div id="yarn-wrap">
  <canvas id="yarn-canvas" width="88" height="88" style="width:44px;height:44px;"></canvas>
</div>

<div id="mochi-wrap">
  <canvas id="mochi-canvas" width="160" height="160" style="width:80px;height:80px;"></canvas>
</div>

<div id="mood-chip">Mochi is exploring the phone... 🐾</div>
<div id="hint-toast">Tap Mochi to pet her · Drag the yarn ball! 🧶</div>

<script>
// =====================================================
//  LIVE CLOCK
// =====================================================
function updateTime() {
  const now = new Date();
  let h = now.getHours(), m = now.getMinutes();
  h = h % 12 || 12;
  document.getElementById('status-time').textContent = h + ':' + String(m).padStart(2,'0');
}
updateTime();
setInterval(updateTime, 15000);

// =====================================================
//  CANVAS SETUP
// =====================================================
const mochiCanvas = document.getElementById('mochi-canvas');
mochiCanvas.width = 160; mochiCanvas.height = 160;
const mCtx = mochiCanvas.getContext('2d');

const yarnCanvas = document.getElementById('yarn-canvas');
yarnCanvas.width = 88; yarnCanvas.height = 88;
const yCtx = yarnCanvas.getContext('2d');

// =====================================================
//  DRAW: YARN BALL
// =====================================================
function drawYarn(ctx, spin) {
  ctx.clearRect(0, 0, 88, 88);
  ctx.save();
  ctx.translate(44, 44);
  ctx.rotate(spin);

  const r = 18;
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(3, r + 5, r - 2, 5, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.globalAlpha = 1;

  const g = ctx.createRadialGradient(-5, -5, 2, 0, 0, r + 3);
  g.addColorStop(0, '#f9a8d4');
  g.addColorStop(0.5, '#ec4899');
  g.addColorStop(1, '#9d174d');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.42)';
  ctx.lineWidth = 1.5;
  ctx.lineCap = 'round';
  for (let i = 0; i < 6; i++) {
    ctx.save();
    ctx.rotate((i / 6) * Math.PI);
    ctx.beginPath();
    ctx.moveTo(-r + 2, -3);
    ctx.quadraticCurveTo(0, -r * 0.7, r - 2, -3);
    ctx.stroke();
    ctx.restore();
  }

  ctx.globalAlpha = 0.32;
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.ellipse(-7, -7, 5, 3, -0.5, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalAlpha = 0.65;
  ctx.strokeStyle = '#f472b6';
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(r - 3, -3);
  ctx.quadraticCurveTo(r + 8, -12, r + 4, -20);
  ctx.stroke();

  ctx.restore();
}

// =====================================================
//  DRAW: MOCHI — full walking animation
// =====================================================
// mood: 'walk' | 'sit' | 'sleep' | 'happy' | 'excited'
function drawMochi(ctx, { walkPhase, facing, mood, blinkOpen, petAnim, tailSway }) {
  ctx.clearRect(0, 0, 160, 160);

  const isWalking = mood === 'walk' || mood === 'excited';
  const isSitting = mood === 'sit' || mood === 'sleep' || mood === 'happy';
  const isSleeping = mood === 'sleep';

  ctx.save();
  if (facing === 'left') { ctx.translate(160, 0); ctx.scale(-1, 1); }

  const t = walkPhase * Math.PI * 2;
  const bodyBob = isWalking ? Math.sin(t * 2) * 2.5 : 0;
  const bodyTilt = isWalking ? Math.sin(t) * 2 : 0;

  // anchor at pixel 80, 105 (body center)
  ctx.save();
  ctx.translate(80, 105 + bodyBob);
  ctx.rotate(bodyTilt * Math.PI / 180);

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.14;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(0, 34, 24, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // ---- TAIL ----
  const tailWag = isSitting
    ? Math.sin(Date.now() * 0.0018) * 20
    : Math.sin(t * 1.5) * 15 + tailSway * 22;
  {
    ctx.save();
    ctx.translate(20, 14);
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(tailWag * 0.9, 20, tailWag * 1.5, 12);
    ctx.stroke();
    ctx.strokeStyle = '#fde68a';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(tailWag * 1.3, 13);
    ctx.quadraticCurveTo(tailWag * 1.7, 8, tailWag * 1.6, 2);
    ctx.stroke();
    ctx.restore();
  }

  if (isSitting) {
    // ---- SITTING ----
    // Haunches
    ctx.fillStyle = '#d97706';
    ctx.beginPath(); ctx.ellipse(-14, 18, 12, 15, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(14, 18, 12, 15, 0.2, 0, Math.PI * 2); ctx.fill();

    // Body
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.ellipse(0, 6, 21, 24, 0, 0, Math.PI * 2); ctx.fill();

    // Belly
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath(); ctx.ellipse(0, 12, 12, 17, 0, 0, Math.PI * 2); ctx.fill();

    // Front paws
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.ellipse(-10, 27, 9, 5.5, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, 27, 9, 5.5, -0.2, 0, Math.PI * 2); ctx.fill();
    // Toes
    ctx.fillStyle = '#fbbf24';
    for (const sx of [-1, 1]) {
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath();
        ctx.ellipse(sx * 10 + i * 2.5, 30, 2, 1.5, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Body stripes
    ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = '#92400e';
    ctx.beginPath(); ctx.ellipse(-10, -2, 4, 13, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, -2, 4, 13, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

  } else {
    // ---- WALKING ----
    const legSwing  = Math.sin(t) * 15;
    const legSwing2 = Math.sin(t + Math.PI) * 15;

    // Back legs
    ctx.fillStyle = '#d97706';
    for (const [ox, sw] of [[-14, legSwing], [14, legSwing2]]) {
      ctx.save();
      ctx.translate(ox, 20);
      ctx.rotate(sw * 0.6 * Math.PI / 180);
      ctx.beginPath(); ctx.roundRect(-5, 0, 10, 17, 5); ctx.fill();
      ctx.beginPath(); ctx.ellipse(0, 17, 7, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Body
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath(); ctx.ellipse(0, 6, 19, 22, 0, 0, Math.PI * 2); ctx.fill();

    // Belly
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath(); ctx.ellipse(0, 10, 10, 15, 0, 0, Math.PI * 2); ctx.fill();

    // Stripes
    ctx.save(); ctx.globalAlpha = 0.2; ctx.fillStyle = '#92400e';
    ctx.beginPath(); ctx.ellipse(-10, 0, 4, 11, -0.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(10, 0, 4, 11, 0.2, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    // Front legs
    ctx.fillStyle = '#f59e0b';
    for (const [ox, sw] of [[-11, legSwing2], [11, legSwing]]) {
      ctx.save();
      ctx.translate(ox, 14);
      ctx.rotate(sw * Math.PI / 180);
      ctx.beginPath(); ctx.roundRect(-4, 0, 9, 15, 4); ctx.fill();
      ctx.fillStyle = '#fbbf24';
      ctx.beginPath(); ctx.ellipse(0, 15, 6, 3.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }

  // ---- HEAD ----
  const headBob = isWalking ? Math.sin(t * 2 + 0.5) * 1.8 : 0;
  ctx.save();
  ctx.translate(0, -26 + headBob);

  // Neck
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.ellipse(0, 9, 9, 8, 0, 0, Math.PI * 2); ctx.fill();

  // Head
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.ellipse(0, -4, 23, 21, 0, 0, Math.PI * 2); ctx.fill();

  // Forehead stripes
  ctx.save(); ctx.globalAlpha = 0.22; ctx.strokeStyle = '#92400e';
  ctx.lineWidth = 2.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-9, -13); ctx.lineTo(-11, -23); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, -25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9, -13); ctx.lineTo(11, -23); ctx.stroke();
  ctx.restore();

  // Ears
  ctx.fillStyle = '#d97706';
  ctx.beginPath(); ctx.moveTo(-15, -14); ctx.lineTo(-23, -33); ctx.lineTo(-5, -21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.moveTo(-15, -16); ctx.lineTo(-20, -29); ctx.lineTo(-8, -21); ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#d97706';
  ctx.beginPath(); ctx.moveTo(15, -14); ctx.lineTo(23, -33); ctx.lineTo(5, -21); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.moveTo(15, -16); ctx.lineTo(20, -29); ctx.lineTo(8, -21); ctx.closePath(); ctx.fill();

  // Cheek fluff
  ctx.save(); ctx.globalAlpha = 0.4; ctx.fillStyle = '#fbbf24';
  ctx.beginPath(); ctx.ellipse(-19, 1, 7, 5, 0.3, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(19, 1, 7, 5, -0.3, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  // ---- EYES ----
  const eyeH = blinkOpen
    ? (isSleeping ? 2 : (mood === 'excited' ? 13 : 10))
    : 1.5;

  for (const ex of [-9, 9]) {
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.ellipse(ex, -4, 7.5, eyeH * 0.9, 0, 0, Math.PI * 2); ctx.fill();

    if (eyeH > 2) {
      ctx.fillStyle = '#22c55e';
      ctx.beginPath(); ctx.ellipse(ex, -4, 5, eyeH * 0.68, 0, 0, Math.PI * 2); ctx.fill();
      const pw = mood === 'excited' ? 2 : 3.2;
      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.ellipse(ex, -4, pw, eyeH * 0.58, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(ex - 2.5, -6, 1.8, 1.4, -0.5, 0, Math.PI * 2); ctx.fill();
    }

    if (isSleeping && eyeH <= 2) {
      ctx.strokeStyle = '#555'; ctx.lineWidth = 1.8; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(ex - 5, -4); ctx.lineTo(ex + 5, -4); ctx.stroke();
    }
  }

  // Nose
  ctx.fillStyle = '#fca5a5';
  ctx.beginPath(); ctx.moveTo(0, 5); ctx.lineTo(-3, 9); ctx.lineTo(3, 9); ctx.closePath(); ctx.fill();

  // Mouth
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 9); ctx.lineTo(0, 11); ctx.stroke();
  if (mood === 'happy' || mood === 'excited') {
    ctx.beginPath(); ctx.moveTo(-3, 11); ctx.quadraticCurveTo(-6, 15, -4, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(3, 11); ctx.quadraticCurveTo(6, 15, 4, 16); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.moveTo(-4, 12); ctx.quadraticCurveTo(-6, 15, -4, 16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4, 12); ctx.quadraticCurveTo(6, 15, 4, 16); ctx.stroke();
  }

  // Whiskers
  ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = '#fffbeb'; ctx.lineWidth = 1.1; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-10, 5);  ctx.lineTo(-27, 1);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, 8);  ctx.lineTo(-27, 8);  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-10, 11); ctx.lineTo(-25, 15); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 5);   ctx.lineTo(27, 1);   ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 8);   ctx.lineTo(27, 8);   ctx.stroke();
  ctx.beginPath(); ctx.moveTo(10, 11);  ctx.lineTo(25, 15);  ctx.stroke();
  ctx.restore();

  // Pet sparkles orbiting head
  if (petAnim > 0) {
    const colors = ['#f472b6','#facc15','#a78bfa','#34d399','#60a5fa'];
    for (let i = 0; i < 5; i++) {
      const ang = (i / 5) * Math.PI * 2 + Date.now() * 0.003;
      const d = 24 + Math.sin(Date.now() * 0.008 + i) * 4;
      ctx.globalAlpha = petAnim * 0.9;
      ctx.fillStyle = colors[i];
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * d, Math.sin(ang) * d - 4, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  ctx.restore(); // head
  ctx.restore(); // body+tilt
  ctx.restore(); // facing flip
}

// =====================================================
//  STATE
// =====================================================
const W = () => window.innerWidth;
const H = () => window.innerHeight;

const mochi = {
  x: W() * 0.38, y: H() * 0.42,
  vx: 0, vy: 0,
  targetX: 0, targetY: 0,
  facing: 'right',
  walkPhase: 0,
  mood: 'walk',
  blinkOpen: true, blinkTimer: 0,
  tailSway: 0, petAnim: 0,
  state: 'wander',
  stateTimer: 0, wanderTimer: 0,
  sleepTimer: 0, idleTimer: 0,
  speed: 0.45,
};

const yarn = {
  x: W() * 0.62, y: H() * 0.42,
  vx: 0, vy: 0,
  spin: 0,
  dragging: false,
  dragOffX: 0, dragOffY: 0,
  prevX: 0, prevY: 0,
};

const MOCHI_R = 34;
const YARN_R  = 18;
const GRAV = 0.22, FRIC = 0.87, BOUNCE = 0.44;

let lastMoodText = '';
const moodChip = document.getElementById('mood-chip');
function setMood(t) {
  if (t !== lastMoodText) { lastMoodText = t; moodChip.textContent = t; }
}

// Hide hint after 5s
setTimeout(() => { document.getElementById('hint-toast').style.opacity = '0'; }, 5000);

// =====================================================
//  PARTICLES
// =====================================================
function spawnParticle(x, y, arr) {
  const el = document.createElement('div');
  el.className = 'float-particle';
  el.textContent = arr[Math.floor(Math.random() * arr.length)];
  el.style.setProperty('--fx', ((Math.random() - 0.5) * 40) + 'px');
  el.style.left = (x - 10) + 'px'; el.style.top = (y - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}
function spawnZzz(x, y) {
  const el = document.createElement('div');
  el.className = 'zzz-float'; el.textContent = 'z z z';
  el.style.left = x + 'px'; el.style.top = (y - 10) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

// =====================================================
//  INPUT
// =====================================================
const mochiWrap = document.getElementById('mochi-wrap');
function petMochi(cx, cy) {
  mochi.state = 'petted'; mochi.stateTimer = 80 + Math.random() * 60;
  mochi.mood = 'happy'; mochi.petAnim = 1;
  spawnParticle(cx, cy, ['💕','💗','✨','🌸','💖']);
  setMood('Purrrr~ 💕');
}
mochiWrap.addEventListener('touchstart', e => { e.preventDefault(); petMochi(e.touches[0].clientX, e.touches[0].clientY); }, { passive: false });
mochiWrap.addEventListener('mousedown', e => petMochi(e.clientX, e.clientY));

const yarnWrap = document.getElementById('yarn-wrap');
function getXY(e) { return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }

yarnWrap.addEventListener('touchstart', e => {
  e.preventDefault();
  const p = getXY(e);
  yarn.dragging = true;
  yarn.dragOffX = p.x - yarn.x; yarn.dragOffY = p.y - yarn.y;
  yarn.prevX = p.x; yarn.prevY = p.y;
  yarn.vx = 0; yarn.vy = 0;
}, { passive: false });
yarnWrap.addEventListener('mousedown', e => {
  yarn.dragging = true;
  yarn.dragOffX = e.clientX - yarn.x; yarn.dragOffY = e.clientY - yarn.y;
  yarn.prevX = e.clientX; yarn.prevY = e.clientY;
  yarn.vx = 0; yarn.vy = 0;
});
document.addEventListener('touchmove', e => {
  if (!yarn.dragging) return; e.preventDefault();
  const p = getXY(e);
  yarn.vx = (p.x - yarn.prevX) * 0.55; yarn.vy = (p.y - yarn.prevY) * 0.55;
  yarn.prevX = p.x; yarn.prevY = p.y;
  yarn.x = p.x - yarn.dragOffX; yarn.y = p.y - yarn.dragOffY;
}, { passive: false });
document.addEventListener('mousemove', e => {
  if (!yarn.dragging) return;
  yarn.vx = (e.clientX - yarn.prevX) * 0.55; yarn.vy = (e.clientY - yarn.prevY) * 0.55;
  yarn.prevX = e.clientX; yarn.prevY = e.clientY;
  yarn.x = e.clientX - yarn.dragOffX; yarn.y = e.clientY - yarn.dragOffY;
});
document.addEventListener('touchend', () => { yarn.dragging = false; });
document.addEventListener('mouseup',   () => { yarn.dragging = false; });

// =====================================================
//  AI HELPERS
// =====================================================
function pickWander() {
  const pad = 65;
  mochi.targetX = pad + Math.random() * (W() - pad * 2);
  mochi.targetY = pad + Math.random() * (H() - pad * 2);
  mochi.stateTimer = 180 + Math.random() * 280;
  mochi.state = 'wander'; mochi.mood = 'walk';
  mochi.speed = 0.38 + Math.random() * 0.22;
}
pickWander();

// =====================================================
//  MAIN LOOP
// =====================================================
let lastZzz = 0;

function loop(ts) {
  // === YARN PHYSICS ===
  if (!yarn.dragging) {
    yarn.vy += GRAV;
    yarn.vx *= FRIC; yarn.vy *= FRIC;
    yarn.x += yarn.vx; yarn.y += yarn.vy;
    yarn.spin += yarn.vx * 0.05;

    const minX = YARN_R, maxX = W() - YARN_R;
    const minY = YARN_R + 44, maxY = H() - YARN_R;
    if (yarn.x < minX) { yarn.x = minX; yarn.vx = Math.abs(yarn.vx) * BOUNCE; }
    if (yarn.x > maxX) { yarn.x = maxX; yarn.vx = -Math.abs(yarn.vx) * BOUNCE; }
    if (yarn.y < minY) { yarn.y = minY; yarn.vy = Math.abs(yarn.vy) * BOUNCE; }
    if (yarn.y > maxY) { yarn.y = maxY; yarn.vy = -Math.abs(yarn.vy) * BOUNCE * 0.6; }
  } else {
    yarn.spin += yarn.vx * 0.04;
  }

  yarnWrap.style.left = (yarn.x - YARN_R) + 'px';
  yarnWrap.style.top  = (yarn.y - YARN_R) + 'px';

  // === MOCHI AI ===
  const yarnMoving = yarn.dragging || Math.abs(yarn.vx) > 0.7 || Math.abs(yarn.vy) > 0.7;
  const dxY = yarn.x - mochi.x, dyY = yarn.y - mochi.y;
  const distY = Math.sqrt(dxY * dxY + dyY * dyY);

  if (mochi.state === 'petted') {
    mochi.stateTimer--;
    mochi.petAnim = Math.max(0, mochi.petAnim - 0.009);
    if (mochi.stateTimer <= 0) {
      mochi.petAnim = 0; mochi.state = 'idle';
      mochi.idleTimer = 70 + Math.random() * 80; mochi.mood = 'sit';
      setMood('Happy and cozy 😊');
    }

  } else if (mochi.state === 'sleeping') {
    mochi.mood = 'sleep';
    mochi.sleepTimer--;
    if (ts - lastZzz > 1800) { spawnZzz(mochi.x + 28, mochi.y - 50); lastZzz = ts; }
    setMood('Napping... 😴');
    if (mochi.sleepTimer <= 0 || (yarnMoving && distY < 200)) {
      mochi.state = 'idle'; mochi.idleTimer = 50; mochi.mood = 'sit';
    }

  } else if (mochi.state === 'idle') {
    mochi.idleTimer--;
    if (mochi.idleTimer <= 0) {
      Math.random() < 0.18
        ? (mochi.state = 'sleeping', mochi.sleepTimer = 280 + Math.random() * 350, mochi.mood = 'sleep')
        : pickWander();
    }
    if (yarnMoving && distY < 300) { mochi.state = 'chase'; mochi.mood = 'excited'; mochi.speed = 0.85; }

  } else if (mochi.state === 'chase') {
    mochi.mood = 'excited'; mochi.speed = 0.85;
    mochi.targetX = yarn.x; mochi.targetY = yarn.y;
    setMood('Chasing the yarn! 🧶');

    if (distY < MOCHI_R + YARN_R + 4) {
      const ang = Math.atan2(mochi.y - yarn.y, mochi.x - yarn.x);
      yarn.vx += Math.cos(ang + Math.PI) * 2.8;
      yarn.vy += Math.sin(ang + Math.PI) * 2.8;
      spawnParticle(mochi.x, mochi.y - 38, ['✨','💫','⭐','🌟']);
      setMood('Got it! 🐾');
      mochi.state = 'petted'; mochi.stateTimer = 35;
      mochi.mood = 'happy'; mochi.petAnim = 0.6;
    }
    if (!yarnMoving && mochi.state === 'chase') {
      mochi.state = 'idle'; mochi.idleTimer = 70; mochi.mood = 'sit'; mochi.speed = 0.42;
    }

  } else {
    // WANDER
    mochi.stateTimer--;
    const tdx = mochi.targetX - mochi.x, tdy = mochi.targetY - mochi.y;
    const td = Math.sqrt(tdx * tdx + tdy * tdy);
    if (td < 18 || mochi.stateTimer <= 0) {
      mochi.state = 'idle'; mochi.idleTimer = 80 + Math.random() * 120;
      mochi.mood = 'sit'; setMood('Mochi is resting... 🐾');
    } else {
      setMood('Exploring the phone... 🐾');
    }
    if (yarnMoving && distY < 270) { mochi.state = 'chase'; mochi.mood = 'excited'; mochi.speed = 0.85; }
  }

  // === MOVE MOCHI ===
  if (mochi.state === 'wander' || mochi.state === 'chase') {
    const tdx = mochi.targetX - mochi.x, tdy = mochi.targetY - mochi.y;
    const td = Math.sqrt(tdx * tdx + tdy * tdy);
    if (td > 6) {
      mochi.vx += (tdx / td) * mochi.speed;
      mochi.vy += (tdy / td) * mochi.speed;
      if (tdx > 1.5) mochi.facing = 'right';
      else if (tdx < -1.5) mochi.facing = 'left';
    }
  }
  mochi.vx *= 0.80; mochi.vy *= 0.80;
  mochi.x += mochi.vx; mochi.y += mochi.vy;

  // Bounds
  const pad = 48;
  if (mochi.x < pad) { mochi.x = pad; mochi.vx = Math.abs(mochi.vx) * 0.3; mochi.targetX += 80; }
  if (mochi.x > W() - pad) { mochi.x = W() - pad; mochi.vx = -Math.abs(mochi.vx) * 0.3; mochi.targetX -= 80; }
  if (mochi.y < 58) { mochi.y = 58; mochi.vy = Math.abs(mochi.vy) * 0.3; }
  if (mochi.y > H() - pad) { mochi.y = H() - pad; mochi.vy = -Math.abs(mochi.vy) * 0.3; }

  // Walk phase (drives leg animation)
  const spd = Math.sqrt(mochi.vx * mochi.vx + mochi.vy * mochi.vy);
  if ((mochi.state === 'wander' || mochi.state === 'chase') && spd > 0.1) {
    mochi.walkPhase += spd * 0.042;
  }

  // Blink
  mochi.blinkTimer++;
  const blinkEvery = mochi.mood === 'sleep' ? 9999 : 145;
  if (mochi.blinkTimer >= blinkEvery) {
    mochi.blinkOpen = !mochi.blinkOpen;
    mochi.blinkTimer = mochi.blinkOpen ? 0 : -8;
  }
  mochi.tailSway = Math.sin(Date.now() * 0.0014) * 0.5;

  // === RENDER ===
  drawMochi(mCtx, {
    walkPhase: mochi.walkPhase, facing: mochi.facing, mood: mochi.mood,
    blinkOpen: mochi.blinkOpen, petAnim: mochi.petAnim, tailSway: mochi.tailSway,
  });
  mochiWrap.style.left = (mochi.x - 40) + 'px';
  mochiWrap.style.top  = (mochi.y - 55) + 'px';

  drawYarn(yCtx, yarn.spin);

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
